name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub release with built EXE files"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Windows executables
        shell: pwsh
        run: |
          .\packaging\windows\build-windows-exe.ps1 -BuildCLI -CreateDesktopShortcuts:$false

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $webui = Get-ChildItem -Path .\dist -Recurse -Filter "DH5a-UTG-WebUI.exe" | Select-Object -First 1
          if (-not $webui) { throw "DH5a-UTG-WebUI.exe not found in dist" }
          Copy-Item $webui.FullName .\artifacts\DH5a-UTG-WebUI.exe -Force

          $cli = Get-ChildItem -Path .\dist -Recurse -Filter "DH5a-UTG-CLI.exe" | Select-Object -First 1
          if (-not $cli) { throw "DH5a-UTG-CLI.exe not found in dist" }
          Copy-Item $cli.FullName .\artifacts\DH5a-UTG-CLI.exe -Force

          Get-ChildItem -Path .\dist -Recurse -File | Where-Object { $_.Name -like "*DH5a-UTG*.exe" } | ForEach-Object { Write-Host $_.FullName }
          Copy-Item README.md .\artifacts\README.md
          Compress-Archive -Path .\artifacts\* -DestinationPath .\artifacts\DH5a-UTG-windows-executables.zip -Force
          Get-ChildItem -Path .\artifacts -Force | ForEach-Object { Write-Host $_.FullName }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: artifacts

      - name: Upload GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseTitle = "DH5a-UTG $tag"
          gh config set prompt disabled
          gh release view $tag --repo "${{ github.repository }}" > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title $releaseTitle --generate-notes
          }
          gh release upload $tag --repo "${{ github.repository }}" `
            "artifacts/DH5a-UTG-WebUI.exe#DH5a-UTG-WebUI.exe" `
            "artifacts/DH5a-UTG-CLI.exe#DH5a-UTG-CLI.exe" `
            "artifacts/DH5a-UTG-windows-executables.zip#DH5a-UTG-windows-executables.zip" `
            --clobber
